[project]
name = "trackiq-be"
version = "0.1.0"
description = "TrackIQ Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.15",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "anyio>=4.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "email-validator>=2.1.0",
    "alembic>=1.13.0",
    "gunicorn>=22.0.0",
    "json-repair>=0.30.0",
    "pypdf>=4.1.0",
]

[tool.ruff]

line-length = 120
select = ["E", "F", "I"]
fix = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
