name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test (every PR and push)
  # ─────────────────────────────────────────────
  lint-and-test:
    name: 🔍 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -r requirements.txt

      - name: ✅ Run Ruff Linting
        run: ruff check . --output-format=github

      - name: ✅ Run Tests
        run: pytest tests/ -v

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push Docker Image to GHCR
  # ─────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────
  # JOB 3A: Deploy to Railway (Free Tier)
  # Requires: RAILWAY_TOKEN secret
  # ─────────────────────────────────────────────
  deploy-railway:
    name: � Deploy to Railway
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

  # ─────────────────────────────────────────────
  # JOB 3B: Deploy to GCP Cloud Run (Free Tier)
  # Requires: GCP_PROJECT_ID, GCP_SA_KEY secrets
  # ─────────────────────────────────────────────
  deploy-cloud-run:
    name: ☁️ Deploy to GCP Cloud Run
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy trackiq-api \
            --image ghcr.io/${{ github.repository }}:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8000 \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 3 \
            --set-env-vars "PROJECT_NAME=TrackIQ Backend" \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: 🎉 Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe trackiq-api \
            --platform managed \
            --region us-central1 \
            --format 'value(status.url)' \
            --project ${{ secrets.GCP_PROJECT_ID }})
          echo "✅ Deployed to: $URL"
